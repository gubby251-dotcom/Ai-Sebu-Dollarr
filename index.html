/* =========================================================
   SEBU DOLLAR AI
   4-RULE SIGNAL ENGINE
   =========================================================
   RULE 1 : MARKET HARUS BERGERAK DENGAN BEBERAPA CANDLE
            MINIMAL 2 CANDLE SEARAH SEBELUM ENGULFING

   RULE 2 : CANDLE KEDUA HARUS MENJADI ENGULFING DAN SUDAH
            CLOSE

   RULE 3 : ENTRY = 50% BODY CANDLE KEDUA / ENGULFING

   RULE 4 : SL = WICK EXTREME ANTARA CANDLE PERTAMA DAN
            CANDLE KEDUA ENGULFING

   BUY:
   bearish candles -> bearish C1 -> bullish engulfing C2 close
   -> entry 50% body C2 -> SL low terendah C1/C2

   SELL:
   bullish candles -> bullish C1 -> bearish engulfing C2 close
   -> entry 50% body C2 -> SL high tertinggi C1/C2
   ========================================================= */

/* =========================================================
   AUDIO
   ========================================================= */

function playAlarmSound() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        let now = audioCtx.currentTime;

        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1600, now);
        gain1.gain.setValueAtTime(1.0, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);

        osc1.start(now);
        osc1.stop(now + 0.25);

        let osc2 = audioCtx.createOscillator();
        let gain2 = audioCtx.createGain();

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(2200, now + 0.3);
        gain2.gain.setValueAtTime(1.0, now + 0.3);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);

        osc2.start(now + 0.3);
        osc2.stop(now + 0.55);

    } catch(e) {
        console.warn("Audio background restriction:", e);
    }
}

function sendDesktopNotification(title, bodyText) {
    if (window.Notification && Notification.permission === 'granted') {
        try {
            let notification = new Notification(title, {
                body: bodyText,
                icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.ico',
                requireInteraction: true,
                tag: 'sebu-dollar-notification'
            });

            notification.onclick = function() {
                window.focus();
                notification.close();
            };

        } catch(err) {
            console.warn("Notification error:", err);
        }
    }
}

/* =========================================================
   TIMEFRAME
   ========================================================= */

function getYahooInterval(){

    const tf = $('tf').value;

    /*
       TradingView:
       30  = M30
       60  = H1
       240 = H4

       Yahoo tidak selalu menyediakan 4H.
       Untuk H4 kita ambil H1 lalu agregasi menjadi H4.
    */

    if(tf === '60'){
        return '60m';
    }

    if(tf === '240'){
        return '60m';
    }

    return '30m';
}

/* =========================================================
   GET REAL XAUUSD CANDLES
   ========================================================= */

async function getRealXAUUSDCandles(){

    try {

        const interval =
            getYahooInterval();

        let range = '5d';

        if(interval === '30m'){
            range = '5d';
        }

        if(interval === '60m'){
            range = '10d';
        }

        const url =
            'https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X' +
            '?interval=' + interval +
            '&range=' + range +
            '&events=history' +
            '&includeAdjustedClose=true';

        const response =
            await fetch(
                url,
                {
                    cache:'no-store'
                }
            );

        if(!response.ok){
            throw new Error(
                'Yahoo HTTP ' +
                response.status
            );
        }

        const json =
            await response.json();

        if(
            !json ||
            !json.chart ||
            !json.chart.result ||
            !json.chart.result[0]
        ){
            throw new Error(
                'Data candle XAUUSD tidak tersedia'
            );
        }

        const result =
            json.chart.result[0];

        const timestamps =
            result.timestamp || [];

        const quote =
            result.indicators &&
            result.indicators.quote &&
            result.indicators.quote[0];

        if(!quote){
            throw new Error(
                'OHLC candle tidak tersedia'
            );
        }

        let candles = [];

        for(
            let i = 0;
            i < timestamps.length;
            i++
        ){

            const open =
                quote.open[i];

            const high =
                quote.high[i];

            const low =
                quote.low[i];

            const close =
                quote.close[i];

            if(
                open == null ||
                high == null ||
                low == null ||
                close == null
            ){
                continue;
            }

            candles.push({
                time: timestamps[i] * 1000,
                open: Number(open),
                high: Number(high),
                low: Number(low),
                close: Number(close)
            });
        }

        if(
            $('tf').value === '240'
        ){
            candles =
                aggregateH1ToH4(candles);
        }

        return candles;

    } catch(e) {

        console.warn(
            "Real candle API error:",
            e
        );

        return [];
    }
}

/* =========================================================
   AGGREGATE H1 -> H4
   ========================================================= */

function aggregateH1ToH4(candles){

    if(!candles || candles.length === 0){
        return [];
    }

    const groups = {};

    candles.forEach(c => {

        const d =
            new Date(c.time);

        /*
           UTC block 4 jam.
           Dibuat konsisten supaya candle
           tidak berubah-ubah.
        */

        const hour =
            d.getUTCHours();

        const blockHour =
            Math.floor(hour / 4) * 4;

        const key =
            Date.UTC(
                d.getUTCFullYear(),
                d.getUTCMonth(),
                d.getUTCDate(),
                blockHour,
                0,
                0
            );

        if(!groups[key]){
            groups[key] = [];
        }

        groups[key].push(c);
    });

    const output = [];

    Object.keys(groups)
        .sort((a,b) => Number(a)-Number(b))
        .forEach(key => {

            const arr =
                groups[key]
                    .sort(
                        (a,b) =>
                        a.time - b.time
                    );

            if(arr.length < 4){
                return;
            }

            const first =
                arr[0];

            const last =
                arr[arr.length - 1];

            output.push({

                time:Number(key),

                open:first.open,

                high:Math.max(
                    ...arr.map(c => c.high)
                ),

                low:Math.min(
                    ...arr.map(c => c.low)
                ),

                close:last.close

            });
        });

    return output;
}

/* =========================================================
   CHECK CANDLE CLOSED
   ========================================================= */

function getClosedCandles(candles){

    if(!candles || candles.length < 6){
        return [];
    }

    /*
       Candle terakhir dari API adalah candle
       yang sedang berjalan.

       Candle tersebut TIDAK boleh dipakai
       sebagai candle engulfing.

       Maka candle terakhir dibuang.
    */

    return candles.slice(
        0,
        candles.length - 1
    );
}

/* =========================================================
   BODY ENGULFING
   ========================================================= */

function isBullishCandle(c){
    return c.close > c.open;
}

function isBearishCandle(c){
    return c.close < c.open;
}

function bodyHigh(c){
    return Math.max(
        c.open,
        c.close
    );
}

function bodyLow(c){
    return Math.min(
        c.open,
        c.close
    );
}

/* =========================================================
   4-RULE VALIDATION ENGINE
   ========================================================= */

function evaluateFourRules(candles){

    if(
        !candles ||
        candles.length < 6
    ){
        return null;
    }

    /*
       Struktur:

       C4 = candle bearish/bullish sebelumnya
       C3 = candle bearish/bullish sebelumnya
       C1 = candle pertama engulfing
       C2 = candle kedua engulfing

       Kita menggunakan:
       minimal 2 candle searah sebelum C1.
    */

    const len =
        candles.length;

    const c2 =
        candles[len - 1];

    const c1 =
        candles[len - 2];

    const c3 =
        candles[len - 3];

    const c4 =
        candles[len - 4];

    /* =====================================================
       RULE 1
       MARKET TURUN DENGAN BEBERAPA CANDLE
       ATAU MARKET NAIK DENGAN BEBERAPA CANDLE
       ===================================================== */

    const previousDown =
        isBearishCandle(c3) &&
        isBearishCandle(c4);

    const previousUp =
        isBullishCandle(c3) &&
        isBullishCandle(c4);

    /*
       Penting:
       Jika hanya 1 candle turun/naik,
       maka TIDAK VALID.
    */

    /* =====================================================
       RULE 2
       ENGULFING CANDLE KEDUA SUDAH CLOSE
       ===================================================== */

    const bullishEngulfing =
        previousDown &&
        isBearishCandle(c1) &&
        isBullishCandle(c2) &&

        /*
           Body C2 harus menelan seluruh
           body C1.
        */

        bodyLow(c2) <= bodyLow(c1) &&
        bodyHigh(c2) >= bodyHigh(c1);

    const bearishEngulfing =
        previousUp &&
        isBullishCandle(c1) &&
        isBearishCandle(c2) &&

        /*
           Body C2 harus menelan seluruh
           body C1.
        */

        bodyHigh(c2) >= bodyHigh(c1) &&
        bodyLow(c2) <= bodyLow(c1);

    /* =====================================================
       BUY
       ===================================================== */

    if(bullishEngulfing){

        /*
           RULE 3:
           ENTRY 50% DARI BODY CANDLE KEDUA
           / CANDLE ENGULFING
        */

        const bodySize =
            Math.abs(
                c2.close -
                c2.open
            );

        const entryLevel =
            Math.min(
                c2.open,
                c2.close
            ) +
            (
                bodySize * 0.5
            );

        /*
           RULE 4:
           SL = WICK PALING RENDAH
           ANTARA C1 DAN C2
        */

        const stopLoss =
            Math.min(
                c1.low,
                c2.low
            );

        const riskDistance =
            Math.abs(
                entryLevel -
                stopLoss
            );

        if(
            !isFinite(entryLevel) ||
            !isFinite(stopLoss) ||
            riskDistance <= 0
        ){
            return null;
        }

        return {

            type:'BUY',

            candleTime:c2.time,

            trendText:
                '✅ MULTI-CANDLE DOWN VALID',

            engulfText:
                '✅ BULLISH ENGULFING CLOSE',

            entry:entryLevel,

            sl:stopLoss,

            tp:
                entryLevel +
                riskDistance,

            riskDistance:riskDistance,

            pips:
                (riskDistance * 10)
                .toFixed(1)

        };
    }

    /* =====================================================
       SELL
       ===================================================== */

    if(bearishEngulfing){

        /*
           RULE 3:
           ENTRY 50% DARI BODY CANDLE KEDUA
           / CANDLE ENGULFING
        */

        const bodySize =
            Math.abs(
                c2.close -
                c2.open
            );

        const entryLevel =
            Math.max(
                c2.open,
                c2.close
            ) -
            (
                bodySize * 0.5
            );

        /*
           RULE 4:
           SL = WICK PALING TINGGI
           ANTARA C1 DAN C2
        */

        const stopLoss =
            Math.max(
                c1.high,
                c2.high
            );

        const riskDistance =
            Math.abs(
                stopLoss -
                entryLevel
            );

        if(
            !isFinite(entryLevel) ||
            !isFinite(stopLoss) ||
            riskDistance <= 0
        ){
            return null;
        }

        return {

            type:'SELL',

            candleTime:c2.time,

            trendText:
                '✅ MULTI-CANDLE UP VALID',

            engulfText:
                '✅ BEARISH ENGULFING CLOSE',

            entry:entryLevel,

            sl:stopLoss,

            tp:
                entryLevel -
                riskDistance,

            riskDistance:riskDistance,

            pips:
                (riskDistance * 10)
                .toFixed(1)

        };
    }

    return null;
}

/* =========================================================
   REALTIME MARKET SCANNER
   ========================================================= */

async function autonomousMarketScanner(){

    if(scannerBusy){
        return;
    }

    scannerBusy = true;

    try {

        const candles =
            await getRealXAUUSDCandles();

        /*
           Data tidak cukup.
        */

        if(
            !candles ||
            candles.length < 6
        ){
            resetAiSetupDisplay();
            return;
        }

        /*
           Buang candle yang sedang berjalan.
           HANYA CANDLE YANG SUDAH CLOSE
           boleh menjadi C2 engulfing.
        */

        const closedCandles =
            getClosedCandles(candles);

        if(
            closedCandles.length < 5
        ){
            resetAiSetupDisplay();
            return;
        }

        /*
           Ambil candle terakhir yang SUDAH CLOSE.
        */

        const latestClosed =
            closedCandles[
                closedCandles.length - 1
            ];

        /*
           Jangan memproses candle yang sama
           berulang kali.
        */

        if(
            lastProcessedCandleTime ===
            latestClosed.time
        ){

            /*
               Jika signal sebelumnya sudah valid,
               tetap pertahankan tampilan.
            */

            return;
        }

        lastProcessedCandleTime =
            latestClosed.time;

        /*
           Evaluasi tepat 4 syarat.
        */

        const result =
            evaluateFourRules(
                closedCandles
            );

        if(result){

            /*
               Proteksi duplicate signal.
            */

            const signalKey =
                result.type +
                "_" +
                result.candleTime;

            if(
                signalKey !==
                lastSignalKey
            ){

                lastSignalKey =
                    signalKey;

                triggerValidSignal(
                    result
                );
            }

        } else {

            /*
               Tidak ada 4 syarat lengkap.
               Signal TIDAK BOLEH muncul.
            */

            resetAiSetupDisplay();
        }

    } catch(e){

        console.warn(
            "Scanner error:",
            e
        );

    } finally {

        scannerBusy = false;
    }
}

/* =========================================================
   LOT CALCULATOR
   ========================================================= */

function calcLot(){

    const eq =
        parseFloat(
            $('equity').value
        ) || 1000;

    const risk =
        parseFloat(
            $('riskPercent').value
        ) || 1;

    const riskUsd =
        (
            eq *
            risk
        ) / 100;

    const slPips =
        (
            activeSlPips > 0
        )
        ? activeSlPips
        : 1.0;

    let lot =
        (
            (
                riskUsd /
                slPips
            ) * 0.01
        ).toFixed(2);

    if(
        isNaN(lot) ||
        lot < 0.01
    ){
        lot = "0.01";
    }

    $('recLot').textContent =
        lot +
        ' Lot';
}

        width:'100%',

        height:'450',

        symbol:'OANDA:XAUUSD',

        interval:tf,

        timezone:'Asia/Jakarta',

        theme:'dark',

        style:'1',

        locale:'id',

        toolbar_bg:'#0b1329',

        enable_publishing:false,

        hide_side_toolbar:false,

        allow_symbol_change:true

    });

    /*
       Ketika timeframe berubah,
       scanner harus membaca candle baru.
    */

    lastProcessedCandleTime =

    resetAiSetupDisplay();

    setTimeout(
        autonomousMarketScanner,

    );
}

/* =========================================================
   AUDIO & NOTIFICATION
   ========================================================= */

function enableAudioAndNotifications(){

    const btn =
        $('audioToggleBtn');

    try {

        if(!audioCtx){

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(
            audioCtx.state ===
            'suspended'
        ){
            audioCtx.resume();
        }

        playAlarmSound();

        soundUnlocked = true;

    } catch(e){}

    if(window.Notification){

        Notification
            .requestPermission()
            .then(permission => {

                if(
                    permission ===
                    'granted'
                ){

                    btn.textContent =
                        '✅ BACKGROUND AUDIO & NOTIFIKASI AKTIF';

                    btn.classList.add(
                        'active'
                    );

                    alert(
                        'Berhasil! Suara & notifikasi sistem aktif.'
                    );

                    sendDesktopNotification(
                        'SEBU DOLLAR AI',
                        'Sistem monitor struktur pasar aktif.'
                    );

                } else {

                    alert(
                        'Izin notifikasi ditolak oleh browser.'
                    );
                }

            });

    } else {

        alert(
            'Browser ini tidak mendukung Web Notification.'
        );
    }
}

   START ENGINE

window.onload = function(){

    updateChart();

    fetchHighImpactNews();

    renderHistory();

    calcLot();

    /*
       Tunggu sebentar agar halaman selesai
       sebelum mengambil candle market.
    */

    setTimeout(
        autonomousMarketScanner,
        2000
    );

    /*
       Scan setiap 15 detik.
       Candle yang sedang berjalan selalu
       dikeluarkan dari validasi sehingga
       C2 harus benar-benar sudah CLOSE.
    */

    setInterval(
        autonomousMarketScanner,
        15000
    );

    setInterval(
        fetchHighImpactNews,
        300000
    );
};
